<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="744"><rect width="1600" height="744" fill="#FFF9EF"/><g font-family="Arial,sans-serif" fill="#153449"><text x="90" y="80" font-size="26" fill="#397BA5">Inside AI · Development notes · 6 October 2026</text><text x="90" y="170" font-size="49" font-weight="bold">Correct meaning. Expected dialect.</text><text x="90" y="230" font-size="29">Two evaluation questions for an assistant serving a local community</text><rect x="90" y="300" width="670" height="290" rx="18" fill="#E5F3F2" stroke="#087F8C" stroke-width="3"/><rect x="840" y="300" width="670" height="290" rx="18" fill="#FBE8D8" stroke="#C66B2B" stroke-width="3"/><text x="125" y="370" font-size="36" fill="#087F8C" font-weight="bold">Content correctness</text><text x="125" y="440" font-size="29">Did the answer get the meaning right?</text><text x="125" y="510" font-size="27">Check facts, context and uncertainty.</text><text x="875" y="370" font-size="36" fill="#C66B2B" font-weight="bold">Dialect fit</text><text x="875" y="440" font-size="29">Does it use the expected variety?</text><text x="875" y="510" font-size="27">Review naturalness with native speakers.</text><text x="90" y="675" font-size="24" fill="#397BA5">Illustrative evaluation framework · not a benchmark result</text></g></svg>